<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self';" />
  <title>Bhatiyani Astute Intelligence</title>
  <script>
    // GitHub Pages SPA redirect trick for BrowserRouter.
    // Encodes the path into the query string and redirects to root index.html.
    var segmentCount = 0;
    var l = window.location;
    var rawPath = l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~');
    var rawSearch = l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '';
    // Validate to prevent external protocol injection in redirect
    if (!/^[a-zA-Z0-9\-_~&/.]+$/.test(rawPath)) {
      rawPath = '';
    }
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
      rawPath +
      rawSearch +
      l.hash
    );
  </script>
</head>
<body>
  <p>Redirecting to Bhatiyani Astute Intelligence...</p>
</body>
</html>
