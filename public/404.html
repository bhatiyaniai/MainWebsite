<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bhatiyani Astute Intelligence</title>
  <script>
    // GitHub Pages SPA redirect trick for BrowserRouter.
    // When GitHub Pages gets a request for a deep link like /solutions,
    // it returns this 404.html. We encode the path into the query string,
    // then redirect to the root index.html which then reads and restores it.
    var segmentCount = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
