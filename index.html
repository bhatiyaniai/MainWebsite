    <!-- GitHub Pages SPA redirect reader: securely restores the path encoded by 404.html -->
    <script>
      (function(l) {
        if (l.search) {
          var targetPath = null;
          var query = '';
          if (l.search[1] === '/') {
            var decoded = l.search.slice(1).split('&').map(function(s) {
              return s.replace(/~and~/g, '&');
            });
            targetPath = decoded[0];
            query = decoded[1] ? '?' + decoded[1] : '';
          } else if (l.search.slice(1, 4) === 'p=/') {
            var decoded = l.search.slice(3).split('&q=').map(function(s) {
              return s.replace(/~and~/g, '&');
            });
            targetPath = decoded[0];
            query = decoded[1] ? '?' + decoded[1] : '';
          }
          // Validate targetPath to ensure it is strictly a safe local relative path (prevent open redirect / protocol-relative attack)
          if (targetPath && targetPath.charAt(0) === '/' && !targetPath.startsWith('//') && !targetPath.includes('\\') && !/^(javascript:|data:|vbscript:)/i.test(targetPath)) {
            window.history.replaceState(
              null, null,
              l.pathname.slice(0, -1) + targetPath + query + l.hash
            );
          }
        }
      }(window.location));
    </script>
